
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hitung Usia</title>
</head>
<body>

    <label for="tanggalLahir">Tanggal lahir kamu:</label>
    <input type="date" id="tanggalLahir">

    <p id="hasil"></p>

    <script>
        const input = document.getElementById("tanggalLahir");
        const hasil = document.getElementById("hasil");

        input.addEventListener("input", function () {
            if (!input.value) {
                hasil.textContent = "";
                return;
            }

            const lahir = new Date(input.value + "T00:00:00");
            const sekarang = new Date();

            if (lahir > sekarang) {
                hasil.textContent = "Tanggal lahir tidak valid.";
                return;
            }

            let tahun = sekarang.getFullYear() - lahir.getFullYear();
            let bulan = sekarang.getMonth() - lahir.getMonth();
            let hari = sekarang.getDate() - lahir.getDate();

            if (hari < 0) {
                bulan--;
                const hariBulanSebelumnya = new Date(
                    sekarang.getFullYear(),
                    sekarang.getMonth(),
                    0
                ).getDate();
                hari += hariBulanSebelumnya;
            }

            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }

            hasil.textContent =
                `Kamu sudah berusia ${tahun} tahun ${bulan} bulan ${hari} hari`;
        });
    </script>

</body>
</html>
